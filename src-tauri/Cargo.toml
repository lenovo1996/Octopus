[package]
name = "gitdock"
version = "0.1.0"
description = "GitDock — Git GUI desktop (Rust + Tauri 2 + Svelte 5 + TypeScript)"
authors = ["GitDock"]
license = "MIT"
edition = "2021"

[lib]
name = "gitdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
